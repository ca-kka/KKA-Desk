name: Build, test and package KKA Desk for Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kka-desk-windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-package:
    permissions:
      contents: read
    name: Build, validate, smoke-test and package Windows x64 EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Kka.Desk.sln

      - name: Build with warnings as errors
        run: dotnet build Kka.Desk.sln --configuration Release --no-restore -warnaserror

      - name: Validate XAML and project XML
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/Kka.Desk/Kka.Desk.csproj" -Raw
          Get-ChildItem -Path src/Kka.Desk -Recurse -Include *.xaml,*.xml | ForEach-Object {
            [xml]$parsed = Get-Content $_.FullName -Raw
            Write-Host "XML OK: $($_.FullName)"
          }

      - name: Ensure no merge-conflict markers
        shell: pwsh
        run: |
          $matches = Get-ChildItem -Path . -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](\.git|bin|obj)[\\/]' } |
            Select-String -Pattern '^(<<<<<<< |=======\s*$|>>>>>>> )'
          if ($matches) {
            $matches | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber) conflict marker" }
            exit 1
          }

      - name: Publish self-contained single-file EXE
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          dotnet publish src/Kka.Desk/Kka.Desk.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/KKA-Desk-Windows-x64

          $exe = "artifacts/KKA-Desk-Windows-x64/Kka.Desk.exe"
          if (-not (Test-Path $exe)) {
            throw "Publish did not produce Kka.Desk.exe"
          }
          if ((Get-Item $exe).Length -lt 100000) {
            throw "Published EXE is unexpectedly small; refusing to package it."
          }

          @"
          KKA Desk - Windows x64 preview
          =================================
          This is a self-contained preview build. It does not require a separately installed .NET runtime.
          Extract this ZIP and run Kka.Desk.exe.

          Important:
          - This is a development preview, not a production-approved client-data application.
          - Government portal downloads, filing, signing and document punching are not enabled.
          - Do not use real client credentials until the Windows credential-vault and portal authentication flows have passed an authorized pilot.
          - Close the application before deleting or replacing the EXE.
          "@ | Set-Content "artifacts/KKA-Desk-Windows-x64/README.txt" -Encoding UTF8

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "SHA256  $hash  Kka.Desk.exe" | Set-Content "artifacts/KKA-Desk-Windows-x64/SHA256SUMS.txt" -Encoding ASCII
          Write-Host "EXE size: $((Get-Item $exe).Length) bytes"
          Write-Host "SHA256: $hash"

      - name: Test local reminders, Credential Manager isolation and mocked auth
        run: dotnet run --project tests/Kka.Desk.CredentialVaultTests/Kka.Desk.CredentialVaultTests.csproj --configuration Release --no-restore

      - name: Smoke-test EXE startup
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "artifacts/KKA-Desk-Windows-x64/Kka.Desk.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "KKA Desk exited during the startup smoke test (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Startup smoke test passed: process stayed alive for 8 seconds."

      - name: Exercise desktop navigation and safety controls in Windows UI
        shell: pwsh
        run: |
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $exePath = "src/Kka.Desk/bin/Release/net10.0-windows/Kka.Desk.exe"
          }
          else {
            $exePath = "artifacts/KKA-Desk-Windows-x64/Kka.Desk.exe"
          }
          if (-not (Test-Path $exePath)) { throw "UI test executable was not found at $exePath." }
          $exe = (Resolve-Path $exePath).Path
          $process = Start-Process -FilePath $exe -PassThru
          $desktop = [System.Windows.Automation.AutomationElement]::RootElement
          $windowType = [System.Windows.Automation.PropertyCondition]::new(
            [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
            [System.Windows.Automation.ControlType]::Window)
          # WPF dialogs are top-level UIA windows; their accessible names may
          # differ from their visual titles, so match the unique accessible name.
          $windowCondition = $windowType

          function Get-AppWindow([string]$title, [int]$timeoutSeconds = 10) {
            $until = (Get-Date).AddSeconds($timeoutSeconds)
            do {
              $all = $desktop.FindAll([System.Windows.Automation.TreeScope]::Descendants, $windowCondition)
              foreach ($candidate in $all) {
                if ($candidate.Current.Name -eq $title) { return $candidate }
              }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $until)
            throw "Could not find app window '$title'."
          }

          function Find-Button($window, [string]$name) {
            $nameCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, $name)
            $typeCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
              [System.Windows.Automation.ControlType]::Button)
            $condition = [System.Windows.Automation.AndCondition]::new($nameCondition, $typeCondition)
            return $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
          }

          function Click-Button($window, [string]$name) {
            $button = Find-Button $window $name
            if ($null -eq $button) { throw "Button '$name' was not found." }
            $button.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Start-Sleep -Milliseconds 300
          }

          function Assert-Text($window, [string]$name) {
            $nameCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, $name)
            $typeCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
              [System.Windows.Automation.ControlType]::Text)
            $condition = [System.Windows.Automation.AndCondition]::new($nameCondition, $typeCondition)
            $text = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
            if ($null -eq $text) { throw "Expected page text '$name' was not found." }
            Write-Host "PASS: main navigation changed page to '$name'."
          }

          try {
            $main = Get-AppWindow "KKA Desk"
            foreach ($item in @(
              @{ Button = "Documents"; Title = "Documents" },
              @{ Button = "Queries"; Title = "Queries" },
              @{ Button = "Client directory"; Title = "Client directory" },
              @{ Button = "Work queue"; Title = "Work queue" },
              @{ Button = "Admin"; Title = "Administration" },
              @{ Button = "Overview"; Title = "Good day." }
            )) {
              Click-Button $main $item.Button
              Assert-Text $main $item.Title
            }

            Click-Button $main "Work queue"
            Assert-Text $main "Work queue"
            Assert-Text $main "Nothing on your list yet"
            if ($null -eq (Find-Button $main "Add reminder")) { throw "Work queue screen missing 'Add reminder' button." }
            Click-Button $main "Add reminder"
            $reminderDialog = Get-AppWindow "New personal reminder"
            if ($null -eq (Find-Button $reminderDialog "Save reminder")) { throw "Reminder dialog missing 'Save reminder' button." }
            if ($null -eq (Find-Button $reminderDialog "Cancel")) { throw "Reminder dialog missing 'Cancel' button." }
            $titleCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, "Reminder title")
            $titleBox = $reminderDialog.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $titleCondition)
            if ($null -eq $titleBox) { throw "Reminder dialog missing its accessible title field." }
            $titleBox.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue("Weekly workspace cleanup")
            Click-Button $reminderDialog "Save reminder"
            $main = Get-AppWindow "KKA Desk"
            $until = (Get-Date).AddSeconds(5)
            do {
              $reminder = $main.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::NameProperty, "Weekly workspace cleanup"))
              if ($null -eq $reminder) { Start-Sleep -Milliseconds 200 }
            } while ($null -eq $reminder -and (Get-Date) -lt $until)
            if ($null -eq $reminder) { throw "Saved personal reminder was not shown in the work queue." }
            Write-Host "PASS: a generic personal reminder can be created and displayed."

            Click-Button $main "Delete"
            $confirmation = Get-AppWindow "Delete reminder"
            Click-Button $confirmation "Keep reminder"
            $until = (Get-Date).AddSeconds(5)
            do {
              $reminder = $main.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::NameProperty, "Weekly workspace cleanup"))
              if ($null -eq $reminder) { Start-Sleep -Milliseconds 200 }
            } while ($null -eq $reminder -and (Get-Date) -lt $until)
            if ($null -eq $reminder) { throw "Cancelling reminder deletion removed the reminder." }
            Write-Host "PASS: cancelling deletion leaves the reminder unchanged."

            Click-Button $main "Delete"
            $confirmation = Get-AppWindow "Delete reminder"
            Click-Button $confirmation "Delete reminder"
            $until = (Get-Date).AddSeconds(5)
            do {
              $emptyState = $main.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::NameProperty, "Nothing on your list yet"))
              if ($null -eq $emptyState) { Start-Sleep -Milliseconds 200 }
            } while ($null -eq $emptyState -and (Get-Date) -lt $until)
            if ($null -eq $emptyState) { throw "Confirming deletion did not return the queue to its empty state." }
            Write-Host "PASS: confirmed deletion removes the generic reminder and records the queue update."

            Click-Button $main "Overview"

            Click-Button $main "Income Tax & GST"
            $tax = Get-AppWindow "Tax Automation | KKA Desk"
            foreach ($control in @("Build job preview", "Run downloads", "Punch documents")) {
              if ($null -eq (Find-Button $tax $control)) { throw "Tax screen missing '$control' button." }
            }
            if ((Find-Button $tax "Run downloads").Current.IsEnabled) {
              throw "Safety failure: Run downloads must remain disabled in preview."
            }
            if ((Find-Button $tax "Punch documents").Current.IsEnabled) {
              throw "Safety failure: Punch documents must remain disabled in preview."
            }
            Write-Host "PASS: tax automation window opens and live download/punch actions remain disabled."
            $tax.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern).Close()

            $main = Get-AppWindow "KKA Desk"
            Click-Button $main "Sync with KKA Portal"
            $portal = Get-AppWindow "KKA Portal Sync"
            if ($null -eq (Find-Button $portal "Sign in")) { throw "Portal sync screen missing Sign in button." }
            Write-Host "PASS: portal sync screen opens; no credentials were entered and no request was sent."
            $portal.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern).Close()
            Write-Host "PASS: Windows UI navigation and safety-control checks completed."
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload downloadable Windows EXE package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: KKA-Desk-Windows-x64
          path: artifacts/KKA-Desk-Windows-x64/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Publish build summary
        if: always()
        shell: pwsh
        run: |
          "KKA Desk CI ran on commit $env:GITHUB_SHA." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Windows x64 package is produced on pushes to main and manual workflow runs." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
