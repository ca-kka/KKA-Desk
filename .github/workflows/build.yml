name: Build, test and package KKA Desk for Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kka-desk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-package:
    permissions:
      contents: read
    name: Build, validate, smoke-test and package Windows x64 EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Kka.Desk.sln

      - name: Build with warnings as errors
        run: dotnet build Kka.Desk.sln --configuration Release --no-restore -warnaserror

      - name: Validate XAML and project XML
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/Kka.Desk/Kka.Desk.csproj" -Raw
          Get-ChildItem -Path src/Kka.Desk -Recurse -Include *.xaml,*.xml | ForEach-Object {
            [xml]$parsed = Get-Content $_.FullName -Raw
            Write-Host "XML OK: $($_.FullName)"
          }

      - name: Ensure no merge-conflict markers
        shell: pwsh
        run: |
          $matches = Get-ChildItem -Path . -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](\.git|bin|obj)[\\/]' } |
            Select-String -Pattern '^(<<<<<<< |=======\s*$|>>>>>>> )'
          if ($matches) {
            $matches | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber) conflict marker" }
            exit 1
          }

      - name: Publish self-contained single-file EXE
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          dotnet publish src/Kka.Desk/Kka.Desk.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/KKA-Desk-Windows-x64

          $exe = "artifacts/KKA-Desk-Windows-x64/Kka.Desk.exe"
          if (-not (Test-Path $exe)) {
            throw "Publish did not produce Kka.Desk.exe"
          }
          if ((Get-Item $exe).Length -lt 100000) {
            throw "Published EXE is unexpectedly small; refusing to package it."
          }

          @"
          KKA Desk - Windows x64 preview
          =================================
          This is a self-contained preview build. It does not require a separately installed .NET runtime.
          Extract this ZIP and run Kka.Desk.exe.

          Important:
          - This is a development preview, not a production-approved client-data application.
          - Government portal downloads, filing, signing and document punching are not enabled.
          - Do not use real client credentials until the Windows credential-vault and portal authentication flows have passed an authorized pilot.
          - Close the application before deleting or replacing the EXE.
          "@ | Set-Content "artifacts/KKA-Desk-Windows-x64/README.txt" -Encoding UTF8

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "SHA256  $hash  Kka.Desk.exe" | Set-Content "artifacts/KKA-Desk-Windows-x64/SHA256SUMS.txt" -Encoding ASCII
          Write-Host "EXE size: $((Get-Item $exe).Length) bytes"
          Write-Host "SHA256: $hash"

      - name: Test Windows Credential Manager isolation and cleanup
        if: github.event_name != 'pull_request'
        run: dotnet run --project tests/Kka.Desk.CredentialVaultTests/Kka.Desk.CredentialVaultTests.csproj --configuration Release --no-restore

      - name: Smoke-test EXE startup
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "artifacts/KKA-Desk-Windows-x64/Kka.Desk.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "KKA Desk exited during the startup smoke test (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Startup smoke test passed: process stayed alive for 8 seconds."

      - name: Upload downloadable Windows EXE package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: KKA-Desk-Windows-x64
          path: artifacts/KKA-Desk-Windows-x64/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Publish build summary
        if: always()
        shell: pwsh
        run: |
          "KKA Desk CI ran on commit $env:GITHUB_SHA." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Windows x64 package is produced on pushes to main and manual workflow runs." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  codeql:
    name: CodeQL security analysis
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build for CodeQL
        run: dotnet build Kka.Desk.sln --configuration Release
      - name: Analyze (local only; repository code scanning upload is not enabled)
        uses: github/codeql-action/analyze@v3
        with:
          upload: false

  publish-release:
    name: Publish only after build, Windows tests, startup smoke test and CodeQL pass
    needs: [build-test-package, codeql]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build-test-package.result == 'success' && needs.codeql.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download tested Windows package
        uses: actions/download-artifact@v4
        with:
          name: KKA-Desk-Windows-x64
          path: artifacts/KKA-Desk-Windows-x64

      - name: Ensure only the latest main commit is released
        id: latest
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          LATEST="$(git rev-parse refs/remotes/origin/main)"
          if [ "$LATEST" = "$GITHUB_SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "This run matches the current main branch head."
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; skipping release publication."
          fi

      - name: Publish latest tested Windows preview release
        if: steps.latest.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          name: KKA Desk Windows Preview #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Automated Windows x64 preview for KKA Desk.

            The Windows build, XAML/XML checks, Windows Credential Manager isolation tests using dummy credentials, executable startup smoke test, and CodeQL analysis passed for this release.

            This is a development preview, not a production-approved client-data application. Live portal OTP acceptance, live profile authorization, tax-portal downloads, filing/signing, and document punching are not certified by this build.
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            artifacts/KKA-Desk-Windows-x64/Kka.Desk.exe
            artifacts/KKA-Desk-Windows-x64/README.txt
            artifacts/KKA-Desk-Windows-x64/SHA256SUMS.txt
